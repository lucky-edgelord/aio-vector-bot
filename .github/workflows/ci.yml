name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg (music tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install (builds vector-sdk-py from source)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate example config
        run: VECTOR_NSEC=nsec1placeholder python -m vectiq --check
      - name: Test
        run: pytest -q --timeout 120
      - name: Build the wheel and try it in a clean folder
        run: |
          pip wheel --no-deps -q -w dist .
          pip install --force-reinstall --no-deps -q dist/*.whl
          mkdir /tmp/fresh && cd /tmp/fresh
          vectiq --version && vectiq --init && VECTOR_NSEC=nsec1placeholder vectiq --check
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vectiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the example config inside the image
        run: docker run --rm -e VECTOR_NSEC=nsec1placeholder vectiq:ci python -m vectiq --check
