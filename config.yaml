# Vectiq configuration. Edit, then run `!vectiq reload` (no restart needed, even for modules).
# Secrets (the bot key) live in .env, never here.

prefix: "!"

# Where Vectiq works. Leave `communities` empty to serve every Community the bot is in.
communities: []
owners: []            # npubs that can use !vectiq admin commands everywhere

modules:              # every feature is a module: on or off. Only modules that are on are loaded.
  # Safety                Change these live with `!module on <name>`, the dashboard or `vectiq --setup`.
  moderation: true    # warnings, timeouts, kicks, bans, softbans, purge, lock, slowmode
  automod: false      # removes spam, mass mentions, shouting, invites, floods, risky files (section `automod`)
  sentire: false      # runs the Sentire moderation bot beside Vectiq (does automod's job; section `sentire`)
  linksafety: false   # removes links to scam/malware/adult sites using oisd.nl blocklists (section `linksafety`)
  imageguard: false   # polices pictures: blocklist + optional nudity detector (section `imageguard`)
  verification: true
  securitycam: false  # echo every message from every channel into one staff channel
  # Members
  welcome: true
  onboarding: true    # welcome -> verify -> pick roles, tracked per member
  roles: true
  tickets: true
  # Community
  events: true        # event calendar with RSVPs and reminders
  notifications: false # YouTube uploads, Twitch go-lives, RSS posts (section `notifications`)
  utility: true
  # Fun
  leveling: true
  economy: true
  giveaways: true
  games: true         # WebXDC mini games
  music: false        # music in voice channels (needs: pip install "vectiq[music]" and ffmpeg)
  # Integrations
  webhooks: true
  dashboard: false    # the web dashboard (needs: pip install "vectiq[dashboard]")
  # Plugins you install appear here too (`vectiq --modules` lists them). They start switched off.

plugins:              # modules that don't ship with Vectiq (see the "Writing modules" guide)
  dirs: [modules]             # folders with plugin modules, relative to this file (data/modules is always read)
  allow_install: false        # let owners run `!module install <package>` from chat (runs pip on this computer)


backup:
  # Restore points, like System Restore: the database, config.yaml, dashboard settings and event
  # pictures, saved on a schedule and before risky changes. Roll back with !restorepoint, the
  # dashboard's Restore points page, or vectiq --restore. The bot's key in .env is never saved.
  every_hours: 24             # a scheduled point this often (0 = only before risky changes and by hand)
  keep_automatic: 14          # scheduled and automatic points to keep (oldest go first)
  keep_manual: 20             # points you made yourself to keep
  dir: ""                     # where to keep them (blank = data/restore-points). Another disk is safer.
  include_pictures: true      # include event pictures
events:
  timezone: UTC               # how event times are typed and shown; per community: !event timezone America/New_York
  channel: announcements      # where event posts go: a name or id ("announcements" finds "📣┊Announcements");
                              # blank = the channel the command was used in
  banner_image: true          # post a drawn banner above each event (a picture attached to the command wins)
  default_minutes: 60         # length when none is given
  reminders: [60, 15]         # minutes before the start: a general post in the channel + a DM to people going
  dm_reminders: true          # personal reminders by DM (the channel only ever gets a general post)
  who_can_create: staff       # staff (Manage Messages) | everyone
  attendee_roles: false       # give people who are going a temporary role (needs Manage Roles)
  calendar_image: true        # !calendar as a picture
  week_starts: monday         # monday | sunday (the calendar picture)

securitycam:                  # needs modules.securitycam: true
  channel: ""                 # channel (name or id) that receives the echoes; or set it in chat with !securitycam set. Keep it staff-only.
  include_bots: false         # also echo other bots (this bot is never echoed)
  ignore_channels: []         # channels to skip

moderation:
  mute_max_days: 28           # longest timeout a moderator can give, in days (Vector allows up to 28)
  warn_threshold: 3           # warnings before the action below
  warn_action: timeout        # timeout | kick | ban | none
  warn_action_minutes: 60     # how long the timeout lasts when warn_action is timeout
  log_channel: ""             # channel name or id for the mod log (blank = none)

# --- Automod (modules.automod) -------------------------------------------------------------------
# Staff (Manage Messages) are never checked. Every rule has its own switch and may set its own action.
automod:
  action: delete              # delete | warn (also a warning) | timeout (also a mute) | log (only tell the mod log)
  timeout_minutes: 10         # mute length for action: timeout
  exempt_roles: []            # roles automod skips
  exempt_channels: []         # channels automod skips
  mentions:                   # more mentions than `max` in one message
    enabled: true
    max: 6
  caps:                       # shouting: this share of capitals in a message this long
    enabled: true
    percent: 80
    min_length: 12
  words:                      # banned words; partial: also inside other words
    enabled: false
    list: []
    partial: false
  invites:                    # Vector, Discord, Telegram, WhatsApp, Signal, Matrix invites
    enabled: true
    allow: []
    extra: []
  links:                      # remove every link except these domains
    enabled: false
    allow: []
  flood:                      # more than `messages` in `seconds`
    enabled: true
    messages: 6
    seconds: 8
  duplicates:                 # the same message more than `repeats` times
    enabled: true
    repeats: 3
    seconds: 60
  files:                      # attachments with these extensions
    enabled: true
    block: [exe, scr, bat, cmd, com, msi, vbs, js, jar, ps1, lnk, apk, dll, hta, reg]
  zalgo:                      # glitchy text stacked with combining marks
    enabled: false
    max_marks: 10

# --- Sentire (modules.sentire) ---------------------------------------------------------------------
# Sentire (github.com/VectorPrivacy/Sentire) is a separate moderation bot. With this module on, Vectiq builds or
# finds it, writes its sentinel.toml from these settings, runs it with its own Vector identity, and can invite it
# into your communities (`!sentire invite`). It does automod's job, so switching it on switches Automod off.
sentire:
  binary: ""                  # blank = data/sentire/bin/sentinel (made by `vectiq --install-sentire`), then PATH
  name: Sentire               # its Vector profile name
  communities: []             # ids or names to watch; blank = every community Vectiq serves
  mod_channel: ""             # where it announces sentences; blank = moderation.log_channel
  poll_secs: 120              # how often it sweeps for floods and raids (at least 90)
  arm:                        # nothing happens until armed: unarmed, it watches and reports
    warn: false
    delete: false
    kick: false
    ban: false
    raid: false
  banned_words: []            # whole words; *word* also matches inside longer ones
  word_gravity: grave         # note | minor | serious | grave
  blocked_links: []           # domains
  link_gravity: serious
  rate:                       # too many messages too fast
    enabled: true
    per_secs: 60
    messages: 10
    gravity: minor
  repetition:                 # the same line again and again
    enabled: true
    times: 4
    gravity: minor
  mass_tagging:               # one message naming a crowd
    enabled: true
    times: 15
    gravity: serious
  ladder:                     # strike totals (they halve every decay_half_life_hours)
    warn_at: 1
    kick_at: 36
    ban_at: 48
    decay_half_life_hours: 168
  raid:
    response: kick            # report | kick | ban
    min_confidence: 75
    tripwire_accounts: 5      # this many strangers...
    tripwire_secs: 30         # ...inside this window starts a raid check
  vision:                     # pictures and video judged by a vision model you choose
    enabled: false
    provider: openai          # openai (any OpenAI-compatible API) | tee (confidential, needs a TEE build)
    base_url: http://127.0.0.1:8080/v1
    model: llava
    api_key_env: ""           # name of the .env variable with the key; blank for a local model
    allow_remote: false       # must be true for any address that isn't this computer
    video: true               # clips become a contact sheet of frames (needs ffmpeg)
  extra: {}                   # any other sentinel.toml settings, merged in as written
  config_file: ""             # use your own sentinel.toml instead of the one Vectiq writes
  log_lines: 300              # lines of its output kept for `!sentire log` and the dashboard

# --- Link safety (modules.linksafety) -------------------------------------------------------------
linksafety:
  lists:                      # domain blocklists, downloaded and cached in data/linksafety
    - https://big.oisd.nl/domainswild2      # oisd big: scams, malware, phishing, ads, tracking (~230k sites)
  nsfw: false                 # also block adult sites (adds https://nsfw.oisd.nl/domainswild2)
  refresh_hours: 24           # download the lists again this often
  allow: []                   # domains always allowed (subdomains included)
  block: []                   # domains always blocked
  action: delete              # delete | warn | timeout | log
  timeout_minutes: 10
  exempt_roles: []
  exempt_channels: []
  safe_browsing_key_env: ""   # optional: name of the .env variable with a Google Safe Browsing API key

# --- Image guard (modules.imageguard) -------------------------------------------------------------
imageguard:
  detector: "off"             # off | nudenet | nsfw-detector | sightengine | http (see the image guard guide)
  threshold: 0.7              # remove at this score or above (0-1, lower = stricter)
  action: delete              # delete | warn | timeout | log
  timeout_minutes: 10
  blocklist: true             # remove pictures blocked with !imageguard block
  match_distance: 6           # how close counts as the same picture (0 = identical; 6 catches resized copies)
  remember: true              # add pictures the detector removed to the blocklist
  max_mb: 15                  # skip bigger pictures
  allow_channels: []          # channels where pictures aren't checked (e.g. an adults-only channel)
  exempt_roles: []
  exempt_channels: []
  nsfw_detector:              # detector: nsfw-detector (pip install "vectiq[nsfw-detector]")
    model_path: ""            # the downloaded Keras .h5 model from github.com/GantMan/nsfw_model
    count_sexy: false         # also count "sexy" (suggestive) as unsafe
  sightengine:                # detector: sightengine; keys go in .env
    user_env: SIGHTENGINE_USER
    secret_env: SIGHTENGINE_SECRET
    models: nudity-2.1
    strict: false             # also count "very suggestive"
  http:                       # detector: http; your API gets the picture as multipart "media"
    url: ""
    score_field: score        # where the 0-1 score is in the JSON answer, e.g. result.nsfw
    header: ""                # optional auth header name, e.g. Authorization
    header_env: ""            # .env variable holding its value

# --- Music (modules.music; needs pip install "vectiq[music]" and ffmpeg) ----------------------
music:
  dj_role: DJ                 # who controls the player (skip without voting, volume, loop...). Blank = everyone.
                              # Staff with Manage Channels and anyone alone with the bot are always DJs.
  default_volume: 80          # percent
  max_volume: 150
  max_queue: 500
  max_track_minutes: 0        # longest song allowed (0 = no limit)
  vote_skip_ratio: 0.5        # share of listeners needed to vote-skip
  leave_when_alone_seconds: 60
  leave_when_idle_seconds: 300
  stay_247: false             # stay in the channel by default (24/7 mode); `247` toggles it
  announce: true              # post "Now playing" in the chat when a song starts
  cards: true                 # "Now playing" and the queue as picture cards with cover art (false = text)
  controls: true              # reaction buttons under "Now playing": ⏯ ⏭ ⏹ 🔁 🔀 📜
  search: ytsearch            # ytsearch (YouTube) | ytmsearch (YouTube Music) | scsearch (SoundCloud)
  allow_playlists: true
  max_playlist: 100           # most songs taken from one playlist
  ffmpeg: ffmpeg              # the ffmpeg program
  cookies_file: ""            # YouTube cookies.txt for servers YouTube asks to "sign in" (see the music guide)

# --- Stream & video alerts (modules.notifications) ----------------------------------------------
notifications:
  channel: announcements      # default channel for alerts
  check_minutes: 5            # how often to look for new posts
  max_per_check: 3            # most posts per feed each time (stops a flood after downtime)
  messages: {}                # override the text per type: youtube / twitch / rss; {title} {url} {author}
  twitch:                     # Twitch needs an app from dev.twitch.tv; put its id and secret in .env
    client_id_env: TWITCH_CLIENT_ID
    client_secret_env: TWITCH_CLIENT_SECRET
  feeds: []                   # alerts declared here (more can be added with !notify add)
  # feeds:
  #   - type: youtube         # youtube | twitch | rss
  #     source: "@LinusTechTips"   # channel link, @handle or id; Twitch name; or a feed link
  #     channel: videos       # channel name or id (blank = the default above)
  #     community: ""         # blank = every community the bot serves
  #     role: ""              # role to mention
  #     message: ""           # custom text for this feed

leveling:
  xp_min: 15                  # each rewarded message gives a random amount of XP between xp_min and xp_max
  xp_max: 25
  cooldown_seconds: 60        # a member earns XP at most once per this many seconds
  cards: true                 # !rank and !leaderboard send images (false = plain text)
  announce: true              # post level-up messages
  announce_channel: ""        # blank = the channel the user was typing in
  no_xp_channels: []          # channels (name or id) where chatting earns no XP
  rewards: {}                 # level: role name (created if missing), e.g.  5: Regular

economy:
  currency_name: coins        # what the money is called in messages
  currency_symbol: "🪙"
  daily_amount: 200           # coins from !daily
  daily_streak_bonus: 25      # extra per streak day, capped by daily_streak_cap
  daily_streak_cap: 10        # the bonus stops growing after this many days in a row
  work_min: 40                # !work pays a random amount between work_min and work_max
  work_max: 120
  work_cooldown_minutes: 30   # how long before a member can !work again
  start_balance: 100          # cash a new wallet starts with
  message_reward: 0           # coins per chatting message (0 = off)

tickets:
  category: ""                # category name to create ticket channels in (blank = none)
  log_channel: ""             # channel noting opened and closed tickets (blank = none)
  support_role: ""            # role name that can see every ticket
  max_open_per_user: 2        # open tickets one member can have at once
  close_emoji: "🔒"            # react with this inside a ticket to close it (blank = off)
  transcripts: true           # keep the chat of each ticket (!tickets transcript, and the dashboard)

verification:
  # How new members prove they're human. question: answer a sum in chat. button: react ✅.
  # captcha: open a personal one-time link and pass a CAPTCHA (needs the web server; see below).
  mode: question              # question | button | captcha
  role: Verified              # role granted on success (created if missing)
  max_attempts: 3             # question mode: wrong answers allowed before staff must verify them by hand
  channel: ""                 # where new members are greeted (blank = system channel)
  # Hide messages from members who haven't verified yet, and point them at verification.
  gate: "off"                 # off | channel (only the verification channel) | all (every channel)
  spam_kick: 3                # gated messages within 15 minutes before a softban and kick (0 = never)
  softban_escalate: 3         # times a softbanned member can come back before it becomes a real ban (0 = never)

  # ---- captcha mode ----
  public_url: ""              # address members open the link at; blank = dashboard.base_url. Use https.
  link_minutes: 10            # how long a link works (each link works once; a new one cancels the old)
  captcha:
    provider: Cloudflare Turnstile   # shown on the page; any reCAPTCHA-compatible service works
    site_key: ""                     # public key from your provider
    secret_key_env: CAPTCHA_SECRET   # environment variable holding the secret key (keep it out of this file)
    verify_url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    script_url: https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit
  # One verification per device: scrambled markers of the IP, a cookie and the browser are kept
  # (never linked to the member) and a second account from the same device is stopped.
  device_check: true
  device_check_days: 30       # how long a device stays marked
  on_duplicate: refuse        # refuse (just say no) | kick | softban. Shared Wi-Fi can look like one device.
  min_age: 0                  # ask for an age and turn away anyone younger (0 = don't ask)
  adult_role: ""              # role members who said 18+ can claim with !adult (blank = none)
  # Invite gate: run verification in a lobby community; verified members are invited to this
  # community (name or id) and removed from the lobby a minute later. Blank = off.
  invite_to: ""
  log_channel: ""             # verifications, refusals and softbans are noted here (blank = moderation.log_channel)
welcome:
  enabled: true               # post welcome and goodbye messages
  channel: ""                 # blank = system channel
  message: "Welcome to {community}, {mention}! You are member #{count}."   # placeholders: {mention} {name} {community} {count}
  leave_message: "{name} has left {community}."   # shown when someone leaves
  leave_channel: ""           # where leave messages go (blank = the welcome channel)
  dm_message: ""              # optional private welcome sent by DM (blank = none)

onboarding:
  steps: [verify, pick_roles]     # what a new member goes through, in order
  channel: ""                     # where the role menu lives (blank = system channel)
  log_channel: ""                 # notes who finished onboarding (blank = none)
  required: false                 # true: onboarding only completes once they pick a role
  title: "Pick your interests"   # heading of the role menu
  prompt: "Welcome! Pick your roles below, then say hi."   # text under the heading
  done_message: "{mention} you're all set. Enjoy {community}!"   # sent when a member finishes
  role_menu:                      # emoji: role name (roles are created if missing)
    "🎮": Gamer
    "🎨": Artist
    "💻": Dev

giveaways:
  max_winners: 10             # most winners one giveaway can have
  min_minutes: 1              # shortest giveaway allowed

games:
  allow_unverified: false     # TESTING ONLY: trust players whose identity can't be verified (relayed connections)
  join_when: opened           # opened: referee joins when a player opens the app | shared: as soon as it is posted
  winner_coins: 50            # paid by the referee when someone wins a mini game
  draw_coins: 10              # paid to each player when a game ends in a draw
  trivia_coins_per_point: 10  # trivia pays this per point scored
  slots_max_bet: 1000         # biggest bet !play slots accepts
  idle_timeout_seconds: 300   # the referee leaves a game nobody has touched for this long

# --- Webhooks: declare them here, Vectiq creates them for you ------------------------------
webhooks:
  server:
    enabled: false            # serve the HTTP endpoint so outside tools (GitHub, Grafana, ...) can post
    host: 0.0.0.0             # network address to listen on
    port: 8080
    base_url: "http://localhost:8080"   # the public address people reach the server at
    admin_key_env: WEBHOOKS_ADMIN_KEY   # name of the env var holding an optional admin key
  hooks: []                   # the list of hooks; see the webhooks guide for the fields
  # hooks:
  #   - name: deploys             # unique name
  #     community: ""             # community name (blank = the only/first one)
  #     channel: deploys          # channel name or id the hook posts into
  #     notify: [owners]          # who gets the URL by DM when it is created: owners | npub...
  #     events: [mod, joins]      # Vectiq events mirrored into the channel: mod, joins, leaves, levels, tickets, giveaways, games, onboarding, events

# --- Web dashboard (turn on with modules.dashboard: true) -----------------------------------
dashboard:
  host: 127.0.0.1             # 127.0.0.1 = only this computer; put HTTPS (Caddy, Tailscale...) in front for remote use
  port: 8090                  # port the dashboard listens on
  base_url: "http://localhost:8090"   # the address people open; used in sign-in links
  session_days: 7             # how long a sign-in lasts
  code_minutes: 10            # how long a Vector sign-in code lasts
  vector_code_login: true     # also allow signing in with a one-time code sent by Vector DM
