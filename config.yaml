# Vectiq configuration. Edit, then restart (or run `!vectiq reload`).
# Secrets (the bot key) live in .env, never here.

prefix: "!"

# Where Vectiq works. Leave `communities` empty to serve every Community the bot is in.
communities: []
owners: []            # npubs that can use !vectiq admin commands everywhere

modules:              # switch whole features on or off
  moderation: true
  leveling: true
  economy: true
  tickets: true
  verification: true
  roles: true
  giveaways: true
  games: true         # WebXDC mini games
  welcome: true
  onboarding: true    # welcome -> verify -> pick roles, tracked per member
  utility: true
  webhooks: true
  events: true        # event calendar with RSVPs and reminders
  securitycam: false  # echo every message from every channel into one staff channel
  dashboard: false    # the web dashboard


backup:
  # Restore points, like System Restore: the database, config.yaml, dashboard settings and event
  # pictures, saved on a schedule and before risky changes. Roll back with !restorepoint, the
  # dashboard's Restore points page, or vectiq --restore. The bot's key in .env is never saved.
  every_hours: 24             # a scheduled point this often (0 = only before risky changes and by hand)
  keep_automatic: 14          # scheduled and automatic points to keep (oldest go first)
  keep_manual: 20             # points you made yourself to keep
  dir: ""                     # where to keep them (blank = data/restore-points). Another disk is safer.
  include_pictures: true      # include event pictures
events:
  timezone: UTC               # how event times are typed and shown; per community: !event timezone America/New_York
  channel: announcements      # where event posts go: a name or id ("announcements" finds "📣┊Announcements");
                              # blank = the channel the command was used in
  banner_image: true          # post a drawn banner above each event (a picture attached to the command wins)
  default_minutes: 60         # length when none is given
  reminders: [60, 15]         # minutes before the start: a general post in the channel + a DM to people going
  dm_reminders: true          # personal reminders by DM (the channel only ever gets a general post)
  who_can_create: staff       # staff (Manage Messages) | everyone
  attendee_roles: false       # give people who are going a temporary role (needs Manage Roles)
  calendar_image: true        # !calendar as a picture
  week_starts: monday         # monday | sunday (the calendar picture)

securitycam:                  # needs modules.securitycam: true
  channel: ""                 # channel (name or id) that receives the echoes; or set it in chat with !securitycam set. Keep it staff-only.
  include_bots: false         # also echo other bots (this bot is never echoed)
  ignore_channels: []         # channels to skip

moderation:
  mute_max_days: 28           # longest timeout a moderator can give, in days (Vector allows up to 28)
  warn_threshold: 3           # warnings before the action below
  warn_action: timeout        # timeout | kick | ban | none
  warn_action_minutes: 60     # how long the timeout lasts when warn_action is timeout
  log_channel: ""             # channel name or id for the mod log (blank = none)
  automod:
    enabled: false            # check every message from people without Manage Messages
    max_mentions: 6           # more mentions than this in one message breaks the rule
    max_caps_percent: 80      # this share of capital letters or more breaks the rule
    caps_min_length: 12       # only check capitals in messages with at least this many letters
    block_links: false        # messages containing links break the rule
    banned_words: []          # whole words that break the rule (not case sensitive)
    action: delete            # delete: remove the message | warn: remove it and add a warning

leveling:
  xp_min: 15                  # each rewarded message gives a random amount of XP between xp_min and xp_max
  xp_max: 25
  cooldown_seconds: 60        # a member earns XP at most once per this many seconds
  cards: true                 # !rank and !leaderboard send images (false = plain text)
  announce: true              # post level-up messages
  announce_channel: ""        # blank = the channel the user was typing in
  no_xp_channels: []          # channels (name or id) where chatting earns no XP
  rewards: {}                 # level: role name (created if missing), e.g.  5: Regular

economy:
  currency_name: coins        # what the money is called in messages
  currency_symbol: "🪙"
  daily_amount: 200           # coins from !daily
  daily_streak_bonus: 25      # extra per streak day, capped by daily_streak_cap
  daily_streak_cap: 10        # the bonus stops growing after this many days in a row
  work_min: 40                # !work pays a random amount between work_min and work_max
  work_max: 120
  work_cooldown_minutes: 30   # how long before a member can !work again
  start_balance: 100          # cash a new wallet starts with
  message_reward: 0           # coins per chatting message (0 = off)

tickets:
  category: ""                # category name to create ticket channels in (blank = none)
  log_channel: ""             # channel noting opened and closed tickets (blank = none)
  support_role: ""            # role name that can see every ticket
  max_open_per_user: 2        # open tickets one member can have at once
  close_emoji: "🔒"            # react with this inside a ticket to close it (blank = off)
  transcripts: true           # keep the chat of each ticket (!tickets transcript, and the dashboard)

verification:
  # How new members prove they're human. question: answer a sum in chat. button: react ✅.
  # captcha: open a personal one-time link and pass a CAPTCHA (needs the web server; see below).
  mode: question              # question | button | captcha
  role: Verified              # role granted on success (created if missing)
  max_attempts: 3             # question mode: wrong answers allowed before staff must verify them by hand
  channel: ""                 # where new members are greeted (blank = system channel)
  # Hide messages from members who haven't verified yet, and point them at verification.
  gate: "off"                 # off | channel (only the verification channel) | all (every channel)
  spam_kick: 3                # gated messages within 15 minutes before a softban and kick (0 = never)
  softban_escalate: 3         # times a softbanned member can come back before it becomes a real ban (0 = never)

  # ---- captcha mode ----
  public_url: ""              # address members open the link at; blank = dashboard.base_url. Use https.
  link_minutes: 10            # how long a link works (each link works once; a new one cancels the old)
  captcha:
    provider: Cloudflare Turnstile   # shown on the page; any reCAPTCHA-compatible service works
    site_key: ""                     # public key from your provider
    secret_key_env: CAPTCHA_SECRET   # environment variable holding the secret key (keep it out of this file)
    verify_url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    script_url: https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit
  # One verification per device: scrambled markers of the IP, a cookie and the browser are kept
  # (never linked to the member) and a second account from the same device is stopped.
  device_check: true
  device_check_days: 30       # how long a device stays marked
  on_duplicate: refuse        # refuse (just say no) | kick | softban. Shared Wi-Fi can look like one device.
  min_age: 0                  # ask for an age and turn away anyone younger (0 = don't ask)
  adult_role: ""              # role members who said 18+ can claim with !adult (blank = none)
  # Invite gate: run verification in a lobby community; verified members are invited to this
  # community (name or id) and removed from the lobby a minute later. Blank = off.
  invite_to: ""
  log_channel: ""             # verifications, refusals and softbans are noted here (blank = moderation.log_channel)
welcome:
  enabled: true               # post welcome and goodbye messages
  channel: ""                 # blank = system channel
  message: "Welcome to {community}, {mention}! You are member #{count}."   # placeholders: {mention} {name} {community} {count}
  leave_message: "{name} has left {community}."   # shown when someone leaves
  leave_channel: ""           # where leave messages go (blank = the welcome channel)
  dm_message: ""              # optional private welcome sent by DM (blank = none)

onboarding:
  steps: [verify, pick_roles]     # what a new member goes through, in order
  channel: ""                     # where the role menu lives (blank = system channel)
  log_channel: ""                 # notes who finished onboarding (blank = none)
  required: false                 # true: onboarding only completes once they pick a role
  title: "Pick your interests"   # heading of the role menu
  prompt: "Welcome! Pick your roles below, then say hi."   # text under the heading
  done_message: "{mention} you're all set. Enjoy {community}!"   # sent when a member finishes
  role_menu:                      # emoji: role name (roles are created if missing)
    "🎮": Gamer
    "🎨": Artist
    "💻": Dev

giveaways:
  max_winners: 10             # most winners one giveaway can have
  min_minutes: 1              # shortest giveaway allowed

games:
  allow_unverified: false     # TESTING ONLY: trust players whose identity can't be verified (relayed connections)
  join_when: opened           # opened: referee joins when a player opens the app | shared: as soon as it is posted
  winner_coins: 50            # paid by the referee when someone wins a mini game
  draw_coins: 10              # paid to each player when a game ends in a draw
  trivia_coins_per_point: 10  # trivia pays this per point scored
  slots_max_bet: 1000         # biggest bet !play slots accepts
  idle_timeout_seconds: 300   # the referee leaves a game nobody has touched for this long

# --- Webhooks: declare them here, Vectiq creates them for you ------------------------------
webhooks:
  server:
    enabled: false            # serve the HTTP endpoint so outside tools (GitHub, Grafana, ...) can post
    host: 0.0.0.0             # network address to listen on
    port: 8080
    base_url: "http://localhost:8080"   # the public address people reach the server at
    admin_key_env: WEBHOOKS_ADMIN_KEY   # name of the env var holding an optional admin key
  hooks: []                   # the list of hooks; see the webhooks guide for the fields
  # hooks:
  #   - name: deploys             # unique name
  #     community: ""             # community name (blank = the only/first one)
  #     channel: deploys          # channel name or id the hook posts into
  #     notify: [owners]          # who gets the URL by DM when it is created: owners | npub...
  #     events: [mod, joins]      # Vectiq events mirrored into the channel: mod, joins, leaves, levels, tickets, giveaways, games, onboarding, events

# --- Web dashboard (turn on with modules.dashboard: true) -----------------------------------
dashboard:
  host: 127.0.0.1             # 127.0.0.1 = only this computer; put HTTPS (Caddy, Tailscale...) in front for remote use
  port: 8090                  # port the dashboard listens on
  base_url: "http://localhost:8090"   # the address people open; used in sign-in links
  session_days: 7             # how long a sign-in lasts
  code_minutes: 10            # how long a Vector sign-in code lasts
  vector_code_login: true     # also allow signing in with a one-time code sent by Vector DM
