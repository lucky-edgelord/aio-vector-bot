<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Four</title><link rel="stylesheet" href="style.css">
<style>
 #cols { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:10px auto 4px; width:min(94vw,420px); }
 #cols button { padding:6px 0; font-size:18px; } #grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; width:min(94vw,420px); margin:0 auto; background:#1f3a8a; padding:6px; border-radius:12px; }
 .cell { aspect-ratio:1; border-radius:50%; background:var(--bg); } .cell.R { background:#ef4444; } .cell.Y { background:#facc15; } .cell.win { box-shadow:0 0 0 3px #fff; }
 .seat.R b { color:#ef4444; } .seat.Y b { color:#facc15; }
</style></head><body>
<h1>🔴 CONNECT FOUR 🟡</h1>
<div class="seats"><div class="seat R" id="sR"></div><div class="seat Y" id="sY"></div></div>
<div class="status" id="status">Connecting…</div>
<div id="cols"></div><div id="grid"></div><p></p>
<button id="sit">Take a seat</button> <button id="again" class="ghost" hidden>Rematch</button>
<script src="webxdc.js"></script><script src="net.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let S = null;
for (let c = 0; c < 7; c++) { const b = document.createElement("button"); b.textContent = "⬇"; b.onclick = () => net.send({ t: "move", col: c }); $("cols").appendChild(b); }
for (let i = 0; i < 42; i++) { const d = document.createElement("div"); d.className = "cell"; $("grid").appendChild(d); }
$("sit").onclick = () => net.send({ t: "join" });
$("again").onclick = () => net.send({ t: "rematch" });
function mark() { return S && ["R", "Y"].find((m) => S.seats[m] && S.seats[m].addr === net.addr) || null; }
function render() {
  const me = mark(), full = S.seats.R && S.seats.Y;
  for (const m of ["R", "Y"]) {
    const s = S.seats[m], el = $("s" + m);
    el.innerHTML = "<b>●</b> " + (s ? s.name : "open");
    el.className = "seat " + m + (S.turn === m && !S.winner && full ? " turn" : "") + (me === m ? " me" : "");
  }
  const win = new Set((S.line || []).map(([r, c]) => r * 7 + c));
  [...$("grid").children].forEach((d, i) => { d.className = "cell " + S.board[Math.floor(i / 7)][i % 7] + (win.has(i) ? " win" : ""); });
  [...$("cols").children].forEach((b, c) => { b.disabled = !!S.winner || !me || S.turn !== me || !full || !!S.board[0][c]; });
  $("sit").hidden = !!me || !(!S.seats.R || !S.seats.Y);
  $("again").hidden = !S.winner || !me;
  let t = !full ? (me ? "Waiting for an opponent…" : "Waiting for players") : S.turn === me ? "Your turn" : "Their turn";
  if (S.winner === "draw") t = "It's a draw!"; else if (S.winner) t = S.winner === me ? "You win! 🎉" : (S.seats[S.winner].name + " wins");
  setStatus(t);
}
function setStatus(t, err) { $("status").textContent = t; $("status").className = "status" + (err ? " err" : ""); }
net.start((s) => { S = s; render(); }, (e) => { setStatus(e, true); setTimeout(() => S && render(), 2500); });
</script></body></html>
